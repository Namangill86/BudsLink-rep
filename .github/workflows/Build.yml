name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned
        run: |
          xcodebuild -project BudsLink.xcodeproj -scheme BudsLink -sdk iphoneos \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -50
      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/BudsLink.app Payload/
          zip -r BudsLink.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BudsLink-ipa
          path: BudsLink.ipa
